name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  unit-and-integration-tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode compilation
        run: python -m compileall -q src tests

      - name: Run unit and integration tests with coverage
        run: |
          python -c "import sys, pytest; code = pytest.main(['-m', 'not e2e', '--cov=src/tokstance', '--cov-report=xml', '--cov-report=term-missing']); sys.exit(0 if code in (0, 5) else code)"

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-playwright-tests:
    name: E2E Playwright (ubuntu-latest / Python 3.11)
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and Playwright browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: |
          python -c "import sys, pytest; code = pytest.main(['-m', 'e2e']); sys.exit(0 if code in (0, 5) else code)"
