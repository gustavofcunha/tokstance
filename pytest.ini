[pytest]
pythonpath = . src
testpaths = tests
addopts = -q --strict-markers
markers =
    unit: Fast in-memory unit tests for domain, security, and rendering logic.
    integration: Persistence and repository synchronization integration tests.
    e2e: End-to-end browser journey tests using Playwright.
    slow: Slower end-to-end or multi-step workflow tests.

